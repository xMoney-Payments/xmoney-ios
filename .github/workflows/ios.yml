name: iOS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Build and test (iOS Simulator)
        run: |
          chmod +x scripts/xcode-ios-test.sh
          scripts/xcode-ios-test.sh
