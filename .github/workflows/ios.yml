name: iOS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Build and test (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme XMoneyPaymentSheet-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -quiet
